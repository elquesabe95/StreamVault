<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamTV — Canales en Vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e;
    --border: #2a2a2a; --red: #e0001b; --red-dim: #8c0011;
    --text: #f0f0f0; --muted: #6b6b6b; --live: #ff3b3b; --sidebar: 310px;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 52px; background: #000; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--red); }
  .logo span { color: var(--text); }
  .search-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 0 12px; height: 34px; width: 240px; transition: border-color .2s; }
  .search-wrap:focus-within { border-color: var(--red); }
  .search-wrap svg { flex-shrink: 0; color: var(--muted); }
  .search-wrap input { background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 13px; width: 100%; }
  .search-wrap input::placeholder { color: var(--muted); }

  .main { display: flex; flex: 1; overflow: hidden; }

  .player-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #000; }
  .player-wrap { position: relative; flex: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #playerFrame { width: 100%; height: 100%; border: none; display: none; }
  #playerVideo { width: 100%; height: 100%; display: none; object-fit: contain; }

  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 40px; position: absolute; inset: 0; transition: opacity .3s; }
  .placeholder-icon { font-size: 64px; opacity: .2; }
  .placeholder h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: #333; }
  .placeholder p { font-size: 13px; color: #3a3a3a; }

  .now-bar { background: #0a0a0a; border-top: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; min-height: 56px; }
  .live-dot { width: 8px; height: 8px; background: var(--live); border-radius: 50%; animation: pulse 1.5s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,59,59,.5)} 50%{opacity:.7;box-shadow:0 0 0 5px rgba(255,59,59,0)} }
  .nb-logo { width: 32px; height: 32px; object-fit: contain; border-radius: 4px; background: var(--surface2); }
  .nb-name { font-size: 14px; font-weight: 600; }
  .nb-cat { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .live-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px; border-radius: 3px; flex-shrink: 0; }
  .no-channel { color: var(--muted); font-size: 13px; }

  .sidebar { width: var(--sidebar); flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sidebar-header h3 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .sidebar-count { font-size: 11px; color: var(--red); margin-top: 5px; display: flex; align-items: center; gap: 6px; }
  .sidebar-count .dot { width: 6px; height: 6px; background: var(--live); border-radius: 50%; animation: pulse 1.5s infinite; }

  .filter-tabs { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; flex-shrink: 0; border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .tab { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-family: inherit; font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all .2s; }
  .tab:hover { border-color: var(--red-dim); color: var(--text); }
  .tab.active { background: var(--red); border-color: var(--red); color: #fff; }

  .channel-list { overflow-y: auto; flex: 1; padding: 6px 0; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .channel-list::-webkit-scrollbar { width: 4px; }
  .channel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .channel-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background .15s; border-left: 3px solid transparent; }
  .channel-item:hover { background: var(--surface2); }
  .channel-item.active { background: rgba(224,0,27,.08); border-left-color: var(--red); }

  .ch-logo-wrap { width: 42px; height: 42px; flex-shrink: 0; background: var(--surface2); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); }
  .ch-logo-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
  .ch-letter { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--red); }
  .ch-info { flex: 1; min-width: 0; }
  .ch-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-meta { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-live { font-size: 9px; font-weight: 700; letter-spacing: 1px; background: var(--red); color: #fff; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; }

  .sk-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .sk-box { border-radius: 5px; background: linear-gradient(90deg, var(--surface2) 25%, #252525 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .error-msg { padding: 24px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .retry-btn { display: inline-block; margin-top: 12px; background: var(--red); color: #fff; border: none; font-family: inherit; font-size: 12px; font-weight: 600; padding: 8px 18px; border-radius: 5px; cursor: pointer; }

  .player-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.8); color: var(--muted); font-size: 13px; z-index: 5; }
  .player-loading.hidden { display: none; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">Stream<span>TV</span></div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar canal...">
  </div>
</header>

<div class="main">
  <div class="player-area">
    <div class="player-wrap" id="playerWrap">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">📡</div>
        <h2>Selecciona un canal</h2>
        <p>Elige un canal de la lista para comenzar a ver en vivo</p>
      </div>
      <div class="player-loading hidden" id="playerLoading">
        <div><div class="spinner"></div><p>Conectando al stream...</p></div>
      </div>
      <iframe id="playerFrame" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="no-referrer"></iframe>

    </div>
    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-cat="Todos">Todos</button>
    </div>
    <div class="channel-list" id="channelList"></div>
  </aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<script>
var API_BASE   = 'https://streamvault-vj0p.onrender.com/api/v1/tv/all';
var EMBED_BASE = 'https://streamvault-vj0p.onrender.com/embed/live/';

var allChannels    = [];
var activeIdx      = -1;
var activeCategory = 'Todos';
var hlsInstance    = null;

var playerFrame   = document.getElementById('playerFrame');
var playerVideo   = document.getElementById('playerVideo');
var placeholder   = document.getElementById('placeholder');
var playerLoading = document.getElementById('playerLoading');

// Detectar si la URL del canal es del scraper de StreamVault
function isScraperURL(url) {
  return url && (url.includes('/api/v1/scraper') || url.includes('streamvault-vj0p.onrender.com'));
}

// Detectar si la URL es una pagina web (no se puede embeber)
function isWebPageURL(url) {
  return url && (url.includes('teleonline.org/canal/') || url.includes('teleonline.org/'));
}

// Convertir pagina de teleonline a URL del scraper
function toScraperURL(url) {
  var m = url.match(/\/canal\/([^/]+)/);
  if (m) return 'https://streamvault-vj0p.onrender.com/api/v1/scraper?slug=' + m[1] + '&provider=teleonline';
  return url;
}

// Extraer slug para canales del scraper
function getSlug(ch) {
  if (ch.slug) return ch.slug;
  var url = ch.url || '';
  if (url) {
    var m = url.match(/[?&]slug=([^&]+)/);
    if (m) return decodeURIComponent(m[1]);
  }
  return ch.name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '').replace(/-+/g, '-');
}

// Reproducir stream m3u8 directo con HLS.js
function playDirectStream(url) {
  stopPlayer();
  playerLoading.classList.remove('hidden');
  placeholder.style.display = 'none';

  if (Hls.isSupported()) {
    var hls = new Hls();
    hlsInstance = hls;
    hls.loadSource(url);
    hls.attachMedia(playerVideo);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      playerVideo.style.display = 'block';
      playerFrame.style.display = 'none';
      playerVideo.play().catch(function() {});
      playerLoading.classList.add('hidden');
    });
    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        playerLoading.querySelector('p').textContent = 'Error al cargar el stream';
      }
    });
  } else if (playerVideo.canPlayType('application/vnd.apple.mpegurl')) {
    playerVideo.src = url;
    playerVideo.style.display = 'block';
    playerFrame.style.display = 'none';
    playerVideo.play().catch(function() {});
    playerLoading.classList.add('hidden');
  } else {
    // Fallback: usar iframe
    playerFrame.src = url;
    playerFrame.style.display = 'block';
    playerVideo.style.display = 'none';
    playerLoading.classList.add('hidden');
  }
}

function stopPlayer() {
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  playerVideo.pause();
  playerVideo.src = '';
  playerVideo.style.display = 'none';
  playerFrame.src = '';
  playerFrame.style.display = 'none';
  playerFrame.onload = null;
}

function playChannel(ch) {
  var url = ch.url || '';
  var urls = ch.urls || [];

  // Si la URL es una pagina web de teleonline, convertirla a scraper
  if (isWebPageURL(url)) {
    url = toScraperURL(url);
  }

  // Si tiene URLs múltiples, usar la primera directa
  if (urls.length > 0) {
    var firstUrl = urls[0];
    if (firstUrl.includes('.m3u8') || firstUrl.includes('.mp4') || firstUrl.includes('youtube.com')) {
      if (firstUrl.includes('youtube.com')) {
        playYouTube(firstUrl);
        return;
      }
      playDirectStream(firstUrl);
      return;
    }
  }

  // Si la URL es del scraper de StreamVault
  if (isScraperURL(url)) {
    playScraperChannel(ch, url);
    return;
  }

  // Si es YouTube
  if (url && url.includes('youtube.com')) {
    playYouTube(url);
    return;
  }

  // Si es un stream directo (m3u8/mp4)
  if (url && (url.includes('.m3u8') || url.includes('.mp4'))) {
    playDirectStream(url);
    return;
  }

  // Último intento: usar embed con el slug
  if (url) {
    playScraperChannel(ch, url);
    return;
  }

  // Nada funciona
  stopPlayer();
  placeholder.innerHTML = '<div class="placeholder-icon">⚠️</div><h2>Canal no disponible</h2><p>Este canal no tiene stream activo en este momento</p>';
  placeholder.style.display = 'flex';
}

function playYouTube(url) {
  stopPlayer();
  placeholder.style.display = 'none';
  playerFrame.style.display = 'block';
  playerVideo.style.display = 'none';
  playerFrame.src = url;
}

// Modificar playScraperChannel para aceptar url directa
function playScraperChannel(ch, scraperUrl) {
  stopPlayer();
  playerLoading.classList.remove('hidden');
  placeholder.style.display = 'none';

  // Si ya es una URL del scraper, resolverla primero
  if (scraperUrl && scraperUrl.includes('/api/v1/scraper')) {
    fetch(scraperUrl)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success && data.sources && data.sources.length) {
          var streamUrl = data.sources[0].url;
          if (streamUrl.includes('.m3u8')) {
            playDirectStream(streamUrl);
          } else if (streamUrl.includes('youtube.com')) {
            playYouTube(streamUrl);
          } else {
            playerFrame.style.display = 'block';
            playerVideo.style.display = 'none';
            playerFrame.src = streamUrl;
            playerLoading.classList.add('hidden');
          }
        } else {
          playerLoading.classList.add('hidden');
          placeholder.innerHTML = '<div class="placeholder-icon">⚠️</div><h2>Canal caído</h2><p>El stream no está disponible en este momento</p>';
          placeholder.style.display = 'flex';
        }
      })
      .catch(function() {
        playerLoading.classList.add('hidden');
        placeholder.innerHTML = '<div class="placeholder-icon">⚠️</div><h2>Error</h2><p>No se pudo conectar al servidor</p>';
        placeholder.style.display = 'flex';
      });
    return;
  }

  // Si no es scraper, usar embed
  var slug = getSlug(ch);
  var embedUrl = EMBED_BASE + slug;
  playerFrame.style.display = 'block';
  playerVideo.style.display = 'none';
  playerFrame.onload = function() { playerLoading.classList.add('hidden'); };
  playerFrame.src = embedUrl;
  setTimeout(function() { playerLoading.classList.add('hidden'); }, 15000);
}

function showSkeletons() {
  var html = '';
  for (var i = 0; i < 8; i++) {
    html += '<div class="sk-item">'
      + '<div class="sk-box" style="width:42px;height:42px;border-radius:6px;flex-shrink:0"></div>'
      + '<div style="flex:1;display:flex;flex-direction:column;gap:7px">'
      + '<div class="sk-box" style="height:13px;width:70%"></div>'
      + '<div class="sk-box" style="height:11px;width:45%"></div>'
      + '</div></div>';
  }
  document.getElementById('channelList').innerHTML = html;
}

function getFiltered() {
  // Si hay resultados de búsqueda en vivo de la API, usarlos
  if (svSearchResults.length > 0) {
    return svSearchResults;
  }

  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = allChannels.slice();
  if (activeCategory !== 'Todos') {
    list = list.filter(function(ch) {
      return (ch.category || ch.categoria || '') === activeCategory;
    });
  }
  if (q) {
    list = list.filter(function(ch) {
      return ch.name.toLowerCase().indexOf(q) !== -1;
    });
  }
  return list;
}

function renderList() {
  var channels = getFiltered();
  var list = document.getElementById('channelList');
  if (!channels.length) {
    list.innerHTML = '<div class="error-msg">No se encontraron canales</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < channels.length; i++) {
    var ch = channels[i];
    var isActive = activeIdx === i;
    var cat = ch.category || ch.categoria || '';
    var country = ch.country || ch.pais || '';
    var logo = ch.logo || ch.thumbnail || '';
    var letter = ch.name.charAt(0).toUpperCase();
    var meta = [cat, country].filter(Boolean).join(' \u00b7 ') || 'Canal de TV';
    var logoHtml = logo
      ? '<img src="' + logo + '" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'block\'">'
        + '<span class="ch-letter" style="display:none">' + letter + '</span>'
      : '<span class="ch-letter">' + letter + '</span>';
    html += '<div class="channel-item' + (isActive ? ' active' : '') + '" onclick="selectChannel(' + i + ')">'
      + '<div class="ch-logo-wrap">' + logoHtml + '</div>'
      + '<div class="ch-info"><div class="ch-name">' + ch.name + '</div><div class="ch-meta">' + meta + '</div></div>'
      + '<span class="ch-live">EN VIVO</span>'
      + '</div>';
  }
  list.innerHTML = html;
}

function buildTabs() {
  var seen = ['Todos'];
  for (var i = 0; i < allChannels.length; i++) {
    var c = allChannels[i].category || allChannels[i].categoria || '';
    if (c && seen.indexOf(c) === -1) seen.push(c);
  }
  var html = '';
  for (var j = 0; j < seen.length; j++) {
    var cat = seen[j];
    html += '<button class="tab' + (cat === activeCategory ? ' active' : '') + '" data-cat="' + cat + '">' + cat + '</button>';
  }
  var tabs = document.getElementById('filterTabs');
  tabs.innerHTML = html;
  tabs.querySelectorAll('.tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      tabs.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      activeIdx = -1;
      renderList();
    });
  });
}

function selectChannel(i) {
  var channels = getFiltered();
  var ch = channels[i];
  if (!ch) return;
  activeIdx = i;
  renderList();
  playChannel(ch);

  var logo = ch.logo || ch.thumbnail || '';
  var cat = ch.category || ch.categoria || 'Canal';
  var country = ch.country || ch.pais || '';
  var meta = [cat, country].filter(Boolean).join(' \u00b7 ');
  document.getElementById('nowBar').innerHTML =
    '<div class="live-dot"></div>'
    + (logo ? '<img class="nb-logo" src="' + logo + '" alt="" onerror="this.style.display=\'none\'">' : '')
    + '<div><div class="nb-name">' + ch.name + '</div><div class="nb-cat">' + meta + '</div></div>'
    + '<span class="live-badge">EN VIVO</span>';
}

var searchTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  if (!q) { svSearchResults = []; activeIdx = -1; renderList(); return; }
  searchTimer = setTimeout(function() { searchChannelsLive(q); }, 400);
});

// Buscar en la API de StreamVault en tiempo real
// Cargar canales de TVLibre (deportes con streams directos)
async function loadTVLibreChannels() {
  try {
    var res = await fetch('https://apifutboltv.onrender.com/api/channels', {
      headers: { 'x-authorizer': 'colombia-tv-access' }
    });
    var channels = await res.json();
    if (!Array.isArray(channels)) return [];
    var seen = new Set();
    var result = [];
    for (var i = 0; i < channels.length; i++) {
      var ch = channels[i];
      var name = ch.nombre || '';
      var url = ch.url_decoded || '';
      if (!name || !url) continue;
      if (seen.has(name.toLowerCase())) continue;
      seen.add(name.toLowerCase());
      result.push({ name: name, logo: '', category: 'Deportes', country: 'TVLibre', url: url, provider: 'TVLibre' });
    }
    return result;
  } catch(e) { return []; }
}

function init() {
  showSkeletons();
  stopPlayer();
  placeholder.style.display = 'flex';
  document.getElementById('countText').textContent = 'Cargando canales...';

  // Cargar canales curados (YouTube 24/7 + TVLibre) — los que sí funcionan
  Promise.all([
    loadCuratedChannels(),
    loadTVLibreChannels()
  ]).then(function(results) {
    var curated = results[0] || [];
    var tvlibreCh = results[1] || [];

    var seen = new Set();
    allChannels = [];
    [curated, tvlibreCh].forEach(function(list) {
      list.forEach(function(ch) {
        var key = ch.name.toLowerCase().trim();
        if (!key || seen.has(key)) return;
        seen.add(key);
        allChannels.push(ch);
      });
    });

    document.getElementById('countText').textContent = allChannels.length + ' canales en vivo';
    buildTabs();
    renderList();
  }).catch(function(err) {
    document.getElementById('countText').textContent = 'Error al cargar';
    document.getElementById('channelList').innerHTML =
      '<div class="error-msg">No se pudieron cargar los canales.<br><small style="color:#444">' + err.message + '</small><br><button class="retry-btn" onclick="init()">Reintentar</button></div>';
  });
}

// Cargar canales de Animux directo de Firestore
async function loadAnimuxFirestore() {
  var API_KEY = 'AIzaSyC0ROz4tvDU9sg60cfcXV6mCo3vPjGLfPg';
  var PROJECT = 'barbers-9b523';
  var BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/channels';
  var channels = [];
  var pageToken = '';
  var seen = new Set();

  for (var page = 0; page < 10; page++) {
    var url = BASE + '?key=' + API_KEY + '&pageSize=200';
    if (pageToken) url += '&pageToken=' + encodeURIComponent(pageToken);
    try {
      var res = await fetch(url);
      var data = await res.json();
      var docs = data.documents || [];
      if (!docs.length) break;

      for (var i = 0; i < docs.length; i++) {
        var fields = docs[i].fields || {};
        var name = (fields.name && fields.name.stringValue) || '';
        var chUrl = (fields.url && fields.url.stringValue) || '';
        var category = (fields.category && fields.category.stringValue) || 'TV';
        var logo = (fields.logo && fields.logo.stringValue) || '';

        if (!name || !chUrl) continue;
        var key = name.toLowerCase().trim();
        if (seen.has(key)) continue;
        seen.add(key);

        channels.push({
          name: name,
          logo: logo,
          category: category,
          country: '',
          url: chUrl,
          provider: 'Animux'
        });
      }

      pageToken = data.nextPageToken || '';
      if (!pageToken) break;
    } catch(e) { break; }
  }

  return channels;
}
